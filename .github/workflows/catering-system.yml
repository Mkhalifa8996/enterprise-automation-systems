name: Catering Management System CI

on:
  push:
    paths: ["catering-management-system/**", ".github/workflows/catering-system.yml"]
  pull_request:
    paths: ["catering-management-system/**", ".github/workflows/catering-system.yml"]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catering-management-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  tests-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catering-management-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pytest
      # على لينكس بلا واجهة رسومية يعمل الجسر كل المجموعات عدا الشاشات
      - run: python -m pytest tests/test_suites.py -v

  tests-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: catering-management-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # على ويندوز تعمل المجموعات كلها بما فيها اختبارات الواجهة
      - run: python -m pytest tests/test_suites.py -v
